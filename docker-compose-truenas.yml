services:
  mongodb:
    image: mongo:7
    container_name: accounts-2026-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: accountsadmin
      MONGO_INITDB_ROOT_PASSWORD: CHANGE_TO_A_LONG_RANDOM_DATABASE_PASSWORD
    volumes:
      - /mnt/apps/accounts-2026-use/mongodb:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username accountsadmin --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s
    networks:
      - accounts-2026-network

  backend:
    build:
      context: https://github.com/valianktni1/march-weddings-by-mark-accounts.git#main:backend
    container_name: accounts-2026-backend
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      APP_URL: https://accounts2026.weddingsbymark.uk
      ALLOWED_HOSTS: accounts2026.weddingsbymark.uk,192.168.24.10,localhost,127.0.0.1
      CORS_ORIGINS: https://accounts2026.weddingsbymark.uk,http://192.168.24.10:30053
      SESSION_SECRET: CHANGE_TO_A_DIFFERENT_LONG_RANDOM_SESSION_SECRET
      SESSION_HOURS: "12"
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: mark@perfectweddingsbymark.uk
      ADMIN_PASSWORD: CHANGE_TO_A_NEW_STRONG_ADMIN_PASSWORD
      MONGO_URL: mongodb://accountsadmin:CHANGE_TO_A_LONG_RANDOM_DATABASE_PASSWORD@mongodb:27017/?authSource=admin
      DB_NAME: weddings_by_mark_accounts_2026
      STORAGE_ROOT: /app/storage
      MAX_RESTORE_MB: "250"
      GEMINI_API_KEY: ""
      HMRC_SANDBOX_ENABLED: "${HMRC_SANDBOX_ENABLED:-false}"
      HMRC_ENVIRONMENT: "sandbox"
      HMRC_SANDBOX_CLIENT_ID: "${HMRC_SANDBOX_CLIENT_ID:-}"
      HMRC_SANDBOX_CLIENT_SECRET: "${HMRC_SANDBOX_CLIENT_SECRET:-}"
      HMRC_TOKEN_ENCRYPTION_KEY: "${HMRC_TOKEN_ENCRYPTION_KEY:-}"
      HMRC_SANDBOX_NINO: "${HMRC_SANDBOX_NINO:-}"
      HMRC_SANDBOX_TEST_USER_CONFIRMED: "${HMRC_SANDBOX_TEST_USER_CONFIRMED:-false}"
      HMRC_VENDOR_PUBLIC_IP: "${HMRC_VENDOR_PUBLIC_IP:-}"
      HMRC_TRUST_EDGE_HEADERS: "${HMRC_TRUST_EDGE_HEADERS:-false}"
      BOOKING_INTEGRATION_ENABLED: "false"
      BOOKING_INTEGRATION_KEY: "REPLACE_WITH_THE_SAME_64_CHARACTER_SECRET_USED_BY_BOOKING"
    volumes:
      - /mnt/nextcloud/accounts-2026-saved-data:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - accounts-2026-network

  frontend:
    build:
      context: https://github.com/valianktni1/march-weddings-by-mark-accounts.git#main:frontend
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: accounts-2026-frontend
    restart: unless-stopped
    init: true
    ports:
      - 30053:80
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - accounts-2026-network

networks:
  accounts-2026-network:
    name: accounts-2026-network
